<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PomodoroSV - Login</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            background:white;
            padding:40px;
            border-radius:10px;
            width:300px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

         button{
            width:100%;
            padding:10px;
            margin-top:20px;
            background:#4CAF50;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#45a049;
        }

    </style>

</head>
<body>

   

    <div class="login-box">

        <h2>PomodoroSV</h2>
        {% if error %}
    <p style="color:red; text-align:center;">{{ error }}</p>
{% endif %}

        <form method="POST">

            {% csrf_token %}

            <input type="text" name="username" placeholder="Usuario">

            <input type="password" name="password" placeholder="Contraseña">

            <button type="submit">Iniciar Sesión</button>

        </form>

    </div>

 
</body>
</html>
