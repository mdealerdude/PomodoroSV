<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Registro</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{
            background:#f5f5f5;
            height:100vh;
            overflow:hidden;
        }

        .container-main{
            display:flex;
            height:100vh;
        }

        /* PANEL IZQUIERDO */
        .left-panel{
            width:53%;
            position:relative;
            background:
                linear-gradient(rgba(228,233,225,0.78), rgba(228,233,225,0.78)),
                url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?q=80&w=1200&auto=format&fit=crop');
            background-size:cover;
            background-position:center;
            display:flex;
            flex-direction:column;
            justify-content:space-between;
            padding:40px;
        }

        .logo{
            font-size:22px;
            font-weight:700;
            color:#1d1d1d;
            display:flex;
            align-items:center;
            gap:10px;
        }

        .logo i{
            color:#2d8a39;
        }

        .quote{
            max-width:420px;
            margin-top:auto;
            margin-bottom:120px;
        }

        .quote h2{
            font-size:42px;
            font-style:italic;
            font-weight:300;
            color:#454545;
            line-height:1.4;
        }

        .quote span{
            color:#1c8a3f;
            font-weight:700;
            letter-spacing:2px;
            font-size:13px;
        }

        .socials{
            display:flex;
            gap:14px;
        }

        .socials a{
            width:45px;
            height:45px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            text-decoration:none;
            color:white;
            font-size:18px;
        }

        .socials .green{
            background:#7BE66F;
        }

        .socials .blue{
            background:#1573FF;
        }

        .socials .cyan{
            background:#0097A7;
        }

        /* PANEL DERECHO */
        .right-panel{
            width:47%;
            background:white;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px;
        }

        .form-container{
            width:100%;
            max-width:420px;
        }

        .form-container h1{
            font-size:42px;
            font-weight:700;
            color:#111;
            margin-bottom:10px;
        }

        .subtitle{
            color:#6d6d6d;
            margin-bottom:40px;
            font-size:15px;
        }

        .form-label{
            font-size:12px;
            font-weight:700;
            letter-spacing:1px;
            color:#333;
            margin-bottom:10px;
        }

        .input-group{
            margin-bottom:22px;
        }

        .input-group-text{
            background:#dfe2d9;
            border:none;
            color:#7b7b7b;
        }

        .form-control{
            background:#dfe2d9;
            border:none;
            height:50px;
            font-size:14px;
        }

        .form-control:focus{
            box-shadow:none;
            background:#dfe2d9;
        }

        .btn-register{
            width:100%;
            height:55px;
            border:none;
            border-radius:35px;
            background:#0c67c9;
            color:white;
            font-weight:600;
            font-size:16px;
            margin-top:15px;
            transition:0.3s;
        }

        .btn-register:hover{
            background:#0957ab;
        }

        .login-link{
            text-align:center;
            margin-top:25px;
            font-size:14px;
            color:#777;
        }

        .login-link a{
            text-decoration:none;
            font-weight:700;
            color:#0c67c9;
        }

        .divider{
            margin:40px 0 20px;
            display:flex;
            align-items:center;
            gap:10px;
            color:#c2c2c2;
        }

        .divider hr{
            flex:1;
            border:none;
            border-top:1px solid #ddd;
        }

        .copyright{
            text-align:center;
            font-size:11px;
            color:#b0b0b0;
            letter-spacing:1px;
        }

        /* RESPONSIVE */
        @media(max-width:992px){

            .container-main{
                flex-direction:column;
            }

            .left-panel,
            .right-panel{
                width:100%;
            }

            .left-panel{
                height:300px;
            }

            .quote h2{
                font-size:28px;
            }
        }
    </style>
</head>
<body>

    <div class="container-main">

        <!-- IZQUIERDA -->
        <div class="left-panel">

            <div class="logo">
                <i class="bi bi-book-half"></i>
                The Focused Academic
            </div>

            <div class="quote">
                <h2>
                    "The soul that sees beauty may sometimes walk alone."
                </h2>

                <span>THE STUDY RITUAL</span>
            </div>

            <div class="socials">
                <a href="#" class="green">
                    <i class="bi bi-whatsapp"></i>
                </a>

                <a href="#" class="blue">
                    <i class="bi bi-chat-dots"></i>
                </a>

                <a href="#" class="cyan">
                    <i class="bi bi-controller"></i>
                </a>
            </div>

        </div>

        <!-- DERECHA -->
        <div class="right-panel">

            <div class="form-container">

                <h1>Registro</h1>

                <p class="subtitle">
                    Diseña tu entorno ideal para el aprendizaje profundo.
                </p>

                <form method="POST">

                    <label class="form-label">
                        NOMBRE DE USUARIO
                    </label>

                    <div class="input-group">
                        <input type="text"
                               class="form-control"
                               placeholder="o. ej. acad_spirit">

                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>
                    </div>

                    <label class="form-label">
                        CORREO ELECTRÓNICO
                    </label>

                    <div class="input-group">
                        <input type="email"
                               class="form-control"
                               placeholder="estudiante@universitas.edu">

                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>
                    </div>

                    <label class="form-label">
                        CONTRASEÑA
                    </label>

                    <div class="input-group">
                        <input type="password"
                               class="form-control"
                               placeholder="••••••••">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>
                    </div>

                    <label class="form-label">
                        CONFIRMAR CONTRASEÑA
                    </label>

                    <div class="input-group">
                        <input type="password"
                               class="form-control"
                               placeholder="••••••••">

                        <span class="input-group-text">
                            <i class="bi bi-shield-lock"></i>
                        </span>
                    </div>

                    <button type="submit" class="btn-register">
                        Empezar Ritual
                    </button>

                </form>

                <div class="login-link">
                    ¿Ya tienes una cuenta?
                    <a href="#">Iniciar Sesión</a>
                </div>

                <div class="divider">
                    <hr>
                    •
                    <hr>
                </div>

                <div class="copyright">
                    © GRUPO 1D TODOS LOS DERECHOS
                </div>

            </div>

        </div>

    </div>

</body>
</html>
