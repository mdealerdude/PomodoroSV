{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro SV</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            background:#1d1f2a;
            margin:auto;
        }

        .contenedor-principal{
            display:flex;
            min-height:95vh;
            background:#f5f5ee;
            border-radius:35px;
            overflow:hidden;
        }

        .sidebar{
            width:280px;
            background:#efefe7;
            border-right:1px solid #d9d9d0;
            padding:30px 20px;
            display:flex;
            flex-direction:column;
            justify-content:space-between;
        }

        .logo h1{
            font-size:32px;
            color:#0c6b37;
            margin-bottom:5px;
        }

        .logo p{
            font-size:14px;
            color:#777;
        }

        .menu{
            margin-top:40px;
        }

        .menu a{
            display:flex;
            align-items:center;
            text-decoration:none;
            color:#5c6b7c;
            padding:18px 20px;
            margin-bottom:15px;
            border:none;
            border-radius:20px;
            transition:0.3s;
            font-weight:500;
        }

  

        .menu a:hover{
            background:white;
            border-right:5px solid #0c8a3d;
            color:#0c6b37;
            font-weight:600;
        }

        .footer-sidebar{
            margin-top:30px;
        }

        .footer-sidebar a{
            display:block;
            margin-bottom:20px;
            color:#6d6d6d;
            text-decoration:none;
            font-weight:500;
        }

        .contenido{
            flex:1;
            padding:40px 50px;
        }

        .titulo{
            margin-bottom:40px;
        }

        .titulo h1{
            color:#0c6b37;
            font-size:42px;
        }

        .titulo p{
            color:#5f5f5f;
            margin-top:5px;
        }

        .boton-azul{
            background:#0066d6;
            color:white;
            text-decoration:none;
            padding:18px 35px;
            border-radius:40px;
            font-weight:600;
            display:inline-block;
            border:none;
            transition:0.3s;
        }

        .boton-azul:hover{
            background:#0055b3;
        }

        .header-materias{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:40px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
            gap:30px;
        }

        .card{
            background:#f0f0e8;
            border-radius:30px;
            padding:30px;
            min-height:250px;
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .icono{
            width:70px;
            height:70px;
            background:white;
            border-radius:20px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:30px;
            margin-bottom:30px;
        }

        .card h2{
            font-size:34px;
            color:#111;
            margin-bottom:10px;
        }

        .horas{
            color:#0c8a3d;
            font-size:22px;
            font-weight:700;
        }

        .texto-horas{
            color:#555;
            font-size:14px;
            font-weight:600;
        }

        .barra{
            width:100%;
            height:8px;
            background:#d9d9d0;
            border-radius:20px;
            margin-top:20px;
            overflow:hidden;
        }

        .progreso{
            height:100%;
            background:#0c8a3d;
            border-radius:20px;
        }

        .formulario{
            background:#f0f0e8;
            padding:40px;
            border-radius:30px;
            max-width:700px;
        }

        .grupo-formulario{
            margin-bottom:25px;
        }

        .grupo-formulario label{
            display:block;
            margin-bottom:10px;
            font-weight:600;
            color:#222;
        }

        .grupo-formulario input{
            width:100%;
            padding:15px;
            border:none;
            border-radius:15px;
            font-size:16px;
        }

        .btn-guardar{
            background:#0c8a3d;
            color:white;
            border:none;
            padding:15px 30px;
            border-radius:20px;
            font-size:16px;
            cursor:pointer;
            font-weight:600;
        }

        .btn-guardar:hover{
            background:#096d30;
        }

        .btn-logout{
    background:#dc2626;
    color:white;
    padding:14px 24px;
    border-radius:15px;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}

.btn-logout:hover{
    background:#b91c1c;
}

    </style>
    </head>
<body>

    <div class="contenedor-principal">

        <aside class="sidebar">

            <div>

                <div class="logo">
                    <h1>Pomodoro SV</h1>
                </div>

                <div class="menu">
                    <a href="{% url 'pomodoro' %}">Temporizador</a>
                    <a href="{% url 'materias' %}">Materias</a>
                </div>

            </div>

            <a href="{% url 'logout' %}" class="btn-logout">

                Cerrar Sesión

            </a>

        </aside>

        <main class="contenido">

            {% block content %}
            {% endblock %}

        </main>

    </div>

</body>
</html>
